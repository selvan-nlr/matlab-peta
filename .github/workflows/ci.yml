name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-checks:
    name: RTL simulation and host checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip cocotb pyyaml pytest

      - name: Check the generated register map is up to date
        run: make regmap-check

      - name: Run every IP testbench
        run: make test

      - name: Run host-side tests
        run: make host-test
