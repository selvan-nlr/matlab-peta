# SPDX-License-Identifier: MIT
block: sysid
description: >
  Bitstream identification.  The host API reads this block first and refuses to
  talk to a bitstream whose MAGIC or ABI version it does not recognise, which
  turns "the driver silently talks to yesterday's design" into a clear error.
registers:
  - name: MAGIC
    offset: 0x00
    access: ro
    reset: 0x5A4D4958        # "ZMIX"
    description: Constant identifying a ZMIX platform bitstream.

  - name: ABI_VERSION
    offset: 0x04
    access: ro
    description: Register-map ABI version. Host drivers check MAJOR for compatibility.
    fields:
      - {name: PATCH, bits: "7:0",   description: Patch level.}
      - {name: MINOR, bits: "15:8",  description: Additive, backwards-compatible changes.}
      - {name: MAJOR, bits: "23:16", description: Breaking register-map changes.}

  - name: GIT_SHA
    offset: 0x08
    access: ro
    description: First 32 bits of the git commit the bitstream was built from.

  - name: BUILD_UTC
    offset: 0x0C
    access: ro
    description: Build timestamp as a UNIX epoch second count.

  - name: CAPABILITY
    offset: 0x10
    access: ro
    description: Which optional blocks this bitstream actually contains.
    fields:
      - {name: HAS_ADC,     bits: "0",     description: adc_ad7476 present.}
      - {name: HAS_DAC,     bits: "1",     description: dac_spi present.}
      - {name: HAS_OLED,    bits: "2",     description: oled_ctrl present.}
      - {name: HAS_PL_UDP,  bits: "3",     description: PL-side UDP control plane present (variant C).}
      - {name: VARIANT,     bits: "11:8",  description: "Build variant: 0=A ps-linux, 1=B baremetal, 2=C pl-only, 3=D rest."}

  - name: SCRATCH
    offset: 0x14
    access: rw
    reset: 0x00000000
    description: Read/write scratch word. The host self-test uses it to prove the bus works end to end.
